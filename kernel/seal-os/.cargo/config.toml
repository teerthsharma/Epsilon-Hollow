[build]
target = "x86_64-unknown-uefi"
rustflags = [
    "-C", "relocation-model=pic",
    # Kernel-wide retpoline codegen exists on this toolchain as `-Zretpoline`
    # (verified against rustc 1.99.0-nightly 8ab9fdff5: it compiles here, and
    # rewrites `jmp *%rax` into `jmp __llvm_retpoline_r11`). It is off
    # deliberately. The flag is ABI-affecting — core and alloc must be built
    # with it too, which build-std does, but any precompiled Rust dependency
    # entering the link then needs `-Cunsafe-allow-abi-mismatch=retpoline` —
    # and it rewrites every indirect branch in the kernel, which nothing in the
    # local gate can boot-test. Enable it with a boot proof, not on its own.
    # "-Z", "retpoline",
]

[unstable]
build-std = ["core", "alloc"]
